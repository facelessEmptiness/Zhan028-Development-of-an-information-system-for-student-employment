version: '3.8'

services:
  # =============== DATABASES ===============
  users-db:
    image: postgres:18-alpine
    container_name: users-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    networks:
      - diploma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  employer-db:
    image: postgres:18-alpine
    container_name: employer-db
    environment:
      POSTGRES_DB: employer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - employer-db-data:/var/lib/postgresql/data
    networks:
      - diploma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  student-db:
    image: postgres:18-alpine
    container_name: student-db
    environment:
      POSTGRES_DB: student_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - student-db-data:/var/lib/postgresql/data
    networks:
      - diploma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  university-db:
    image: postgres:18-alpine
    container_name: university-db
    environment:
      POSTGRES_DB: university_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - university-db-data:/var/lib/postgresql/data
    networks:
      - diploma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  application-db:
    image: postgres:18-alpine
    container_name: application-db
    environment:
      POSTGRES_DB: application_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - application-db-data:/var/lib/postgresql/data
    networks:
      - diploma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============== MICROSERVICES ===============
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8080"
    environment:
      DB_HOST: users-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_PORT: 8080
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      users-db:
        condition: service_healthy
    networks:
      - diploma-network
    restart: unless-stopped

  student-service:
    build:
      context: ./services/student-service
      dockerfile: Dockerfile
    container_name: student-service
    ports:
      - "50051:50051"
      - "8082:8082"
    environment:
      DB_HOST: student-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: student_db
      GRPC_PORT: 50051
      SERVER_PORT: 8082
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      student-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - diploma-network
    restart: unless-stopped

  employer-service:
    build:
      context: ./services/employer-service
      dockerfile: Dockerfile
    container_name: employer-service
    ports:
      - "50052:50052"
    environment:
      DB_HOST: employer-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: employer_db
      GRPC_PORT: 50052
    depends_on:
      employer-db:
        condition: service_healthy
    networks:
      - diploma-network
    restart: unless-stopped

  university-service:
    build:
      context: ./services/university-service
      dockerfile: Dockerfile
    container_name: university-service
    ports:
      - "50053:50053"
    environment:
      DB_HOST: university-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: university_db
      GRPC_PORT: 50053
    depends_on:
      university-db:
        condition: service_healthy
    networks:
      - diploma-network
    restart: unless-stopped

  application-service:
    build:
      context: ./services/application-service
      dockerfile: Dockerfile
    container_name: application-service
    ports:
      - "50054:50054"
    environment:
      DB_HOST: application-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: application_db
      GRPC_PORT: 50054
    depends_on:
      application-db:
        condition: service_healthy
    networks:
      - diploma-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8080"
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8081
      DOCUMENT_SERVICE_URL: http://student-service:8082
      STUDENT_GRPC_URL: student-service:50051
      EMPLOYER_GRPC_URL: employer-service:50052
      UNIVERSITY_GRPC_URL: university-service:50053
      APPLICATION_GRPC_URL: application-service:50054
    depends_on:
      - auth-service
      - student-service
      - employer-service
      - university-service
      - application-service
    networks:
      - diploma-network
    restart: unless-stopped

  # =============== FRONTEND ===============
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - diploma-network
    restart: unless-stopped

networks:
  diploma-network:
    driver: bridge

volumes:
  users-db-data:
  student-db-data:
  employer-db-data:
  university-db-data:
  application-db-data:
