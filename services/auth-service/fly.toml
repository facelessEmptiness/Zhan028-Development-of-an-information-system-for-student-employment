app = 'careerbond-auth'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  SERVICE_PORT = '8080'
  DB_PORT = '5432'
  DB_USER = 'postgres'
  DB_NAME = 'postgres'
  SMTP_HOST = 'smtp.gmail.com'
  SMTP_PORT = '587'
  SMTP_FROM = 'CareerBond@gmail.com'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
