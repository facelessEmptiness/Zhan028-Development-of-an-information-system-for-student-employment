app = 'careerbond-student'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PORT = '5432'
  DB_USER = 'postgres'
  DB_NAME = 'student_db'
  GRPC_PORT = '50051'
  SERVER_PORT = '8082'

[[services]]
  protocol = 'tcp'
  internal_port = 50051

  [[services.ports]]
    port = 50051
    handlers = ['tls']
    tls_options = { alpn = ['h2'] }

[[services]]
  protocol = 'tcp'
  internal_port = 8082

  [[services.ports]]
    port = 8082

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
